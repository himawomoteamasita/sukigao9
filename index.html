<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RINDO 好き顔9選</title>

<style>
* {
box-sizing: border-box;
}

html,
body {
margin: 0;
padding: 0;
min-height: 100%;
font-family:
-apple-system,
BlinkMacSystemFont,
"Hiragino Kaku Gothic ProN",
"Yu Gothic",
Meiryo,
sans-serif;
background: #fff7fb;
color: #333;
}

body {
min-height: 100vh;
}

button {
font: inherit;
}

.app {
width: 100%;
max-width: 900px;
margin: 0 auto;
min-height: 100vh;
padding-bottom: 110px;
}

/* ------------------------------
HEADER
------------------------------ */

.header {
padding: 25px 20px 12px;
text-align: center;
}

.logo {
font-size: 13px;
font-weight: 800;
letter-spacing: 0.18em;
color: #ff7da9;
margin-bottom: 5px;
}

.progress-text {
font-size: 13px;
color: #777;
font-weight: 700;
}

.progress {
width: min(500px, calc(100% - 40px));
height: 7px;
background: #f3dce5;
border-radius: 999px;
margin: 12px auto 0;
overflow: hidden;
}

.progress-inner {
height: 100%;
background: linear-gradient(90deg, #ff86ae, #ffb2c9);
border-radius: 999px;
transition: width 0.3s ease;
}

/* ------------------------------
TITLES
------------------------------ */

.title-area {
text-align: center;
padding: 22px 20px 20px;
}

.title {
margin: 0;
font-size: clamp(22px, 5vw, 32px);
font-weight: 900;
letter-spacing: 0.02em;
}

.subtitle {
margin: 10px 0 0;
color: #888;
font-size: 13px;
line-height: 1.7;
}

/* ------------------------------
CARDS
------------------------------ */

.cards {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px;
padding: 0 18px;
max-width: 720px;
margin: 0 auto;
}

.card {
position: relative;
border: 3px solid transparent;
border-radius: 20px;
overflow: hidden;
background: white;
box-shadow: 0 6px 20px rgba(120, 70, 90, 0.08);
cursor: pointer;
transition:
transform 0.15s ease,
border-color 0.15s ease,
box-shadow 0.15s ease;
padding: 0;
}

.card:hover {
transform: translateY(-2px);
}

.card.selected {
border-color: #ff79a7;
box-shadow: 0 7px 25px rgba(255, 121, 167, 0.25);
}

.card-image {
width: 100%;
aspect-ratio: 4 / 5;
object-fit: cover;
display: block;
background: #f7e9ef;
}

.card-name {
padding: 11px 8px 13px;
text-align: center;
font-size: 16px;
font-weight: 800;
color: #333;
}

.heart {
position: absolute;
top: 9px;
right: 9px;
width: 38px;
height: 38px;
border-radius: 50%;
background: rgba(255,255,255,0.92);
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
color: #ddd;
box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card.selected .heart {
color: #ff5d93;
background: white;
}

/* ------------------------------
BOTTOM BAR
------------------------------ */

.bottom-bar {
position: fixed;
z-index: 20;
left: 0;
right: 0;
bottom: 0;
background: rgba(255,255,255,0.96);
backdrop-filter: blur(12px);
border-top: 1px solid #f0dce5;
padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
}

.bottom-inner {
max-width: 720px;
margin: 0 auto;
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
gap: 10px;
}

.back-button,
.next-button {
border: none;
border-radius: 999px;
min-height: 48px;
padding: 0 20px;
font-weight: 800;
cursor: pointer;
}

.back-button {
background: #f4eef1;
color: #777;
}

.back-button:disabled {
opacity: 0.35;
cursor: default;
}

.next-button {
background: #ff78a5;
color: white;
}

.next-button:disabled {
background: #e7dce1;
color: #aaa;
cursor: default;
}

.selection-count {
font-size: 13px;
text-align: center;
color: #777;
font-weight: 700;
white-space: nowrap;
}

/* ------------------------------
RESULT / SCREEN
------------------------------ */

.screen {
min-height: 100vh;
}

.center-screen {
padding: 70px 20px 100px;
text-align: center;
}

.clear-label {
font-size: 13px;
letter-spacing: 0.18em;
font-weight: 900;
color: #ff78a5;
}

.clear-title {
margin: 12px 0 0;
font-size: clamp(28px, 7vw, 42px);
font-weight: 900;
}

.clear-text {
color: #888;
line-height: 1.8;
font-size: 14px;
margin: 15px auto 28px;
}

.candidate-list {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 8px;
max-width: 650px;
margin: 0 auto 35px;
}

.candidate {
background: white;
border: 1px solid #f0dce5;
padding: 9px 13px;
border-radius: 999px;
font-size: 13px;
font-weight: 700;
}

.main-button {
border: none;
background: #ff78a5;
color: white;
border-radius: 999px;
padding: 16px 30px;
font-size: 16px;
font-weight: 900;
cursor: pointer;
box-shadow: 0 8px 20px rgba(255, 120, 165, 0.25);
}

/* ------------------------------
FINAL
------------------------------ */

.final-header {
text-align: center;
padding: 40px 20px 25px;
}

.final-label {
color: #ff78a5;
font-size: 13px;
font-weight: 900;
letter-spacing: 0.18em;
}

.final-title {
margin: 10px 0 0;
font-size: clamp(25px, 7vw, 40px);
font-weight: 900;
}

.final-subtitle {
margin-top: 8px;
color: #888;
font-size: 13px;
}

.final-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
padding: 0 15px 30px;
max-width: 780px;
margin: 0 auto;
}

.rank-card {
position: relative;
background: white;
border-radius: 18px;
overflow: hidden;
box-shadow: 0 5px 18px rgba(100, 50, 70, 0.09);
}

.rank-card.rank-1 {
box-shadow:
0 0 0 3px #ffd66b,
0 8px 25px rgba(255, 190, 70, 0.22);
}

.rank-image {
width: 100%;
aspect-ratio: 4 / 5;
object-fit: cover;
display: block;
}

.rank-number {
position: absolute;
top: 7px;
left: 7px;
width: 34px;
height: 34px;
border-radius: 50%;
background: rgba(255,255,255,0.95);
display: flex;
justify-content: center;
align-items: center;
font-size: 14px;
font-weight: 900;
color: #555;
}

.rank-card.rank-1 .rank-number {
background: #ffd66b;
color: white;
}

.rank-name {
padding: 9px 5px 11px;
text-align: center;
font-size: 14px;
font-weight: 900;
}

.final-actions {
text-align: center;
padding: 10px 20px 60px;
}

/* ------------------------------
HEAD TO HEAD
------------------------------ */

.battle-screen {
padding: 25px 15px 60px;
min-height: 100vh;
}

.battle-top {
text-align: center;
margin-bottom: 22px;
}

.battle-label {
color: #ff78a5;
font-size: 12px;
font-weight: 900;
letter-spacing: 0.15em;
}

.battle-title {
font-size: 23px;
font-weight: 900;
margin: 8px 0 5px;
}

.battle-count {
font-size: 12px;
color: #999;
}

.battle-cards {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
max-width: 720px;
margin: 0 auto;
}

.battle-card {
border: 3px solid transparent;
border-radius: 20px;
overflow: hidden;
background: white;
box-shadow: 0 7px 25px rgba(100,50,70,0.10);
cursor: pointer;
padding: 0;
}

.battle-card:hover {
border-color: #ff91b5;
}

.battle-card img {
width: 100%;
aspect-ratio: 4 / 5;
object-fit: cover;
display: block;
}

.battle-name {
padding: 15px 5px;
font-size: 17px;
font-weight: 900;
}

.battle-hint {
text-align: center;
color: #999;
font-size: 12px;
margin-top: 18px;
}

/* ------------------------------
MOBILE
------------------------------ */

@media (max-width: 480px) {
.cards {
gap: 10px;
padding: 0 10px;
}

.card {
border-radius: 15px;
}

.card-name {
font-size: 14px;
padding: 9px 4px 11px;
}

.heart {
width: 32px;
height: 32px;
font-size: 17px;
}

.bottom-inner {
grid-template-columns: auto 1fr auto;
}

.back-button,
.next-button {
padding: 0 15px;
}

.final-grid {
gap: 8px;
padding-left: 8px;
padding-right: 8px;
}

.rank-name {
font-size: 12px;
}

.rank-number {
width: 29px;
height: 29px;
font-size: 12px;
}
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script>

/* =========================================================
RINDO Entertainment TALENT
同名掲載は1名にまとめています
========================================================= */

const names = [
"なめ",
"つばき",
"うと",
"ないち",
"りう",
"りんたろ。",
"はく",
"みお",
"けん",
"えつや",
"ふゆみ",
"かなめ",
"あむ",
"ゆき",
"さく",
"しょうた",
"きょうへい",
"らいと",
"はやと",
"とあ",
"ねる",
"うみ",
"らん",
"そう",
"たく",
"めあ",
"ひろ",
"てん",
"さくら",
"ゆそん",
"たいよう",
"はやて",
"りょう",
"さつき",
"たろ",
"こうた",
"はも",
"せな",
"伊藤。",
"けい",
"こむぎ",
"あゆむ",
"はると",
"みなと",
"ゆうま",
"ゆたか",
"いぶき",
"ふうま",
"たいちん",
"ひかる",
"だいち",
"あさひ",
"こんちゃん",
"みやび",
"かい",
"やまだ",
"つかさ",
"なお",
"うた",
"あとむ",
"しき",
"ひゅうが",
"あらた",
"りき",
"じん",
"うぃる",
"つばさ",
"なぎさ",
"フマル",
"りゅうせい",
"あかね",
"りお",
"なつ",
"禊",
"タイ・マイ",
"梅",
"なつめ",
"よきき",
"りゅーと",
"かぐや",
"れお",
"あさと",
"しの",
"そらん"
];


/* =========================================================
メンバー情報

画像は
images/001.jpg
images/002.jpg
...
images/084.jpg

のように入れてください。
========================================================= */

const members = names.map((name, index) => ({
id: index + 1,
name: name,
image: `images/${String(index + 1).padStart(3, "0")}.jpg`
}));


/* =========================================================
状態
========================================================= */

const TOTAL_ROUNDS = 35;
const FINALISTS = 18;

let round = 0;

let selected = new Set();

let answers = [];

let scores = {};

let preliminaryRounds = [];

let finalists = [];

let ranking = [];

let challengerIndex = 1;

let battleCount = 0;


/* =========================================================
初期化
========================================================= */

function resetGame() {

round = 0;

selected = new Set();

answers = [];

scores = {};

finalists = [];

ranking = [];

challengerIndex = 1;

battleCount = 0;

members.forEach(member => {
scores[member.id] = 0;
});

createPreliminaryRounds();

showPreliminary();
}


/* =========================================================
予選35ラウンドを作る
========================================================= */

function shuffle(array) {

const result = [...array];

for (let i = result.length - 1; i > 0; i--) {

const j = Math.floor(Math.random() * (i + 1));

[result[i], result[j]] = [result[j], result[i]];
}

return result;
}


function randomFour() {

return shuffle(members)
.slice(0, 4);
}


function createPreliminaryRounds() {

preliminaryRounds = [];

/*
最初の21ラウンドで84人全員を一度ずつ出す
*/

const pool = shuffle(members);

for (let i = 0; i < pool.length; i += 4) {

preliminaryRounds.push(
pool.slice(i, i + 4)
);
}

/*
残り14ラウンドはランダム
*/

while (preliminaryRounds.length < TOTAL_ROUNDS) {

preliminaryRounds.push(
randomFour()
);
}
}


/* =========================================================
画像
========================================================= */

function placeholderImage(name) {

const first = name.charAt(0);

const svg = `
<svg xmlns="http://www.w3.org/2000/svg"
width="600"
height="750"
viewBox="0 0 600 750">

<defs>
<linearGradient id="bg"
x1="0"
y1="0"
x2="1"
y2="1">
<stop offset="0%" stop-color="#ffe5ef"/>
<stop offset="100%" stop-color="#f8c8d9"/>
</linearGradient>
</defs>

<rect width="600"
height="750"
fill="url(#bg)"/>

<circle cx="300"
cy="280"
r="120"
fill="#fff"
opacity="0.8"/>

<circle cx="255"
cy="270"
r="10"
fill="#777"/>

<circle cx="345"
cy="270"
r="10"
fill="#777"/>

<path d="M250 340 Q300 380 350 340"
fill="none"
stroke="#777"
stroke-width="8"
stroke-linecap="round"/>

<text x="300"
y="520"
text-anchor="middle"
font-size="70"
font-weight="bold"
fill="#555">${first}</text>

<text x="300"
y="600"
text-anchor="middle"
font-size="30"
font-weight="bold"
fill="#777">PHOTO</text>
</svg>
`;

return "data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(svg);
}


function imageHTML(member, className) {

return `
<img
class="${className}"
src="${member.image}"
alt="${member.name}"
onerror="this.onerror=null; this.src='${placeholderImage(member.name)}';"
>
`;
}


/* =========================================================
予選画面
========================================================= */

function showPreliminary() {

const currentCards = preliminaryRounds[round];

const progress =
((round + 1) / TOTAL_ROUNDS) * 100;

document.getElementById("app").innerHTML = `

<div class="screen">

<header class="header">

<div class="logo">
RINDO ENTERTAINMENT
</div>

<div class="progress-text">
予選 ${round + 1} / ${TOTAL_ROUNDS}
</div>

<div class="progress">
<div
class="progress-inner"
style="width:${progress}%">
</div>
</div>

</header>


<section class="title-area">

<h1 class="title">
この中で好きな顔を選んでね
</h1>

<p class="subtitle">
複数OK。深く考えず、直感でどうぞ💗
</p>

</section>


<main class="cards">

${currentCards.map(member => `

<button
class="card ${selected.has(member.id) ? "selected" : ""}"
onclick="toggleMember(${member.id})">

${imageHTML(member, "card-image")}

<div class="heart">
${selected.has(member.id) ? "♥" : "♡"}
</div>

<div class="card-name">
${member.name}
</div>

</button>

`).join("")}

</main>


<div class="bottom-bar">

<div class="bottom-inner">

<button
class="back-button"
onclick="goBack()"
${round === 0 ? "disabled" : ""}>
← 戻る
</button>


<div class="selection-count">
${selected.size} / 3 人選択
</div>


<button
class="next-button"
onclick="goNext()"
${selected.size === 0 ? "disabled" : ""}>
${round === TOTAL_ROUNDS - 1 ? "予選終了 →" : "次へ →"}
</button>

</div>

</div>

</div>
`;
}


/* =========================================================
選択
========================================================= */

function toggleMember(id) {

if (selected.has(id)) {

selected.delete(id);

} else {

if (selected.size >= 3) {
return;
}

selected.add(id);
}

showPreliminary();
}


/* =========================================================
次へ
========================================================= */

function goNext() {

if (selected.size === 0) {
return;
}

/*
今回の回答を保存
*/

answers[round] = [...selected];


/*
スコア加算
*/

selected.forEach(id => {
scores[id]++;
});


if (round === TOTAL_ROUNDS - 1) {

createFinalists();

showPreliminaryResult();

return;
}


round++;

selected = new Set();

showPreliminary();
}


/* =========================================================
戻る
========================================================= */

function goBack() {

if (round === 0) {
return;
}

/*
現在のラウンドを1つ戻す
*/

round--;


/*
そのラウンドで以前選んだ人の
スコアを取り消す
*/

const previousAnswer = answers[round] || [];

previousAnswer.forEach(id => {
scores[id]--;
});


selected = new Set(previousAnswer);

showPreliminary();
}


/* =========================================================
予選通過者
========================================================= */

function createFinalists() {

finalists = [...members]
.sort((a, b) => {

const scoreDiff =
scores[b.id] - scores[a.id];

if (scoreDiff !== 0) {
return scoreDiff;
}

return Math.random() - 0.5;
})
.slice(0, FINALISTS);
}


/* =========================================================
予選結果
========================================================= */

function showPreliminaryResult() {

document.getElementById("app").innerHTML = `

<div class="screen center-screen">

<div class="clear-label">
PRELIMINARY CLEAR
</div>

<h1 class="clear-title">
予選終了！
</h1>

<p class="clear-text">
あなたの選んだ顔から<br>
${FINALISTS}人が本選へ進みます。
</p>


<div class="candidate-list">

${finalists.map(member => `

<div class="candidate">
${member.name}
</div>

`).join("")}

</div>


<button
class="main-button"
onclick="startFinal()">

🔥 本選へ

</button>

</div>
`;
}


/* =========================================================
本選スタート
========================================================= */

function startFinal() {

/*
まず1人をランキングに置く
*/

ranking = [finalists[0]];

challengerIndex = 1;

battleCount = 0;

showBattle();
}


/* =========================================================
本選：1対1
========================================================= */

function showBattle() {

if (challengerIndex >= finalists.length) {

showFinalResult();

return;
}


const challenger =
finalists[challengerIndex];

const opponentIndex =
Math.min(
battleCount,
ranking.length
);


/*
最初はランキングの上から比較
*/

const opponent =
ranking[
Math.min(
battleCount,
ranking.length - 1
)
];


document.getElementById("app").innerHTML = `

<div class="battle-screen">

<div class="battle-top">

<div class="battle-label">
FINAL ROUND
</div>

<h1 class="battle-title">
どっちの顔が好き？
</h1>

<div class="battle-count">
${challengerIndex} / ${finalists.length - 1}
</div>

</div>


<div class="battle-cards">

<button
class="battle-card"
onclick="chooseBattle(${challenger.id}, ${opponent.id})">

${imageHTML(challenger, "battle-image")}

<div class="battle-name">
${challenger.name}
</div>

</button>


<button
class="battle-card"
onclick="chooseBattle(${opponent.id}, ${challenger.id})">

${imageHTML(opponent, "battle-image")}

<div class="battle-name">
${opponent.name}
</div>

</button>

</div>


<div class="battle-hint">
直感で好きなほうをタップしてね 💗
</div>

</div>
`;
}


/* =========================================================
本選で選択
========================================================= */

function chooseBattle(winnerId, loserId) {

const challenger =
finalists[challengerIndex];

/*
challengerが勝った場合
現在比較している相手の前に入れる
*/

if (winnerId === challenger.id) {

const insertIndex =
Math.min(
battleCount,
ranking.length
);

ranking.splice(
insertIndex,
0,
challenger
);

challengerIndex++;

battleCount = 0;

showBattle();

return;
}


/*
challengerが負けた場合
次の順位候補と比較する
*/

battleCount++;


if (battleCount >= ranking.length) {

ranking.push(challenger);

challengerIndex++;

battleCount = 0;

}


showBattle();
}


/* =========================================================
最終結果
========================================================= */

function showFinalResult() {

/*
念のため9人に限定
*/

const top9 =
ranking.slice(0, 9);


document.getElementById("app").innerHTML = `

<div class="screen">

<div class="final-header">

<div class="final-label">
YOUR SUKIGAO 9
</div>

<h1 class="final-title">
あなたのRINDO好き顔9選 👑
</h1>

<div class="final-subtitle">
あなたの直感で選ばれたTOP9
</div>

</div>


<div class="final-grid">

${top9.map((member, index) => `

<div
class="rank-card ${index === 0 ? "rank-1" : ""}">

${imageHTML(member, "rank-image")}

<div class="rank-number">
${index + 1}
</div>

<div class="rank-name">
${member.name}
</div>

</div>

`).join("")}

</div>


<div class="final-actions">

<button
class="main-button"
onclick="resetGame()">

もう一度やる

</button>

</div>

</div>
`;
}


/* =========================================================
START
========================================================= */

resetGame();

</script>

</body>
</html>
